name: Build MINI APK

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Extract project
        run: unzip -q MINI_android_project_for_APK_build.zip -d project

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3

      - name: Install SDK
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build APK
        run: |
          cd project/MINI_Android_Project
          gradle assembleDebug

      - uses: actions/upload-artifact@v4
        with:
          name: MINI-APK
          path: project/MINI_Android_Project/app/build/outputs/apk/debug/app-debug.apk
